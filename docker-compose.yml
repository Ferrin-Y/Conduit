version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - chroma_data:/app/chroma_data
    environment:
      - CONDUIT_DATABASE_URL=sqlite+aiosqlite:///./conduit.db
      - CONDUIT_CHROMA_PERSIST_DIR=/app/chroma_data

volumes:
  chroma_data:
